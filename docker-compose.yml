services:
  db:
    image: postgres:16-alpine
    container_name: medidecode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medidecode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medidecode_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medidecode}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medidecode}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medidecode_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medidecode_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medidecode}:${POSTGRES_PASSWORD:-medidecode_secure_pass}@db:5432/${POSTGRES_DB:-medidecode}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - medidecode_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medidecode_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - medidecode_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  medidecode_net:
    driver: bridge
