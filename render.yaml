services:
  # ----------------------------------------------------------------------------
  # MediDecode Backend API
  # ----------------------------------------------------------------------------
  - type: web
    name: medidecode-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: medidecode-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'

  # ----------------------------------------------------------------------------
  # MediDecode Frontend Client
  # ----------------------------------------------------------------------------
  - type: web
    name: medidecode-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: medidecode-db
    databaseName: medidecode
    user: medidecode
    plan: free
    region: oregon
